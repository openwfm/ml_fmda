# Config file used to set up forecast analysis
#
target_forecast_dir: "/storage/math/NSF1/hirschij/ml_fmda_forecast_analysis/CONUS/" # Where analysis gets sent
f_start: "2024-01-01T00:00:00Z" # first forecast time
f_end: "2024-12-31T23:00:00Z" # last forecast time
forecast_hours: 48 # number of hours to run forecast before re-initializing (matters for RNN and ODE baseline, has no effect on static ML models nor on climatology). Hours determined by max forecast window of HRRR
stride: 24 # number of time steps to shift window when building RNN data from single sequence, default 1 means heavy data
n_reps: 100 # Number of replications to train/forecast, used to estimate uncertainty in forecast accuracy metrics
train_start: "2023-01-01T00:00:00Z" # first time for training
train_end: "2023-12-31T23:00:00Z" # last time for training
val_hours: 48 # number of hours to use at end of training window (tstart, tend) to use for validation data
space_test_frac: 0.1 # Percentage of data based on location for val and test
bbox: '[24.94,-125,49.6,-66.93]' # spatial bounding box
features_list: ['Ed', 'Ew', 'solar', 'wind', 'elev', 'lon', 'lat', 'rain', 'hod', 'doy'] # inputs to ML models
baselines: ['xgb'] # Names of models to be run on same data for comparison. USE None if only running RNN
climatology_file: "/storage/math/NSF1/hirschij/FMC_CLIMATOLOGY/climatology_conus24/climatology_conus_2024_forecasts.pkl" # name of climatology output to be used for comparison
data_dir: "/storage/math/NSF1/hirschij/FMDA/CONUS/" # Directory for formatted FMDA data dictionaries
valid_path: "/storage/math/NSF1/hirschij/FMDA/valid_data/fmc_valid_CONUS24.csv" # Path to manually constructed table for filtered invalid data. NOTE: as of June 25 2026, CONUS is incomplete, it is 4 combined GACCs for 2023-2024, not full continent
